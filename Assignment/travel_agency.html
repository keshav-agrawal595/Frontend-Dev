<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Agency Showcase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="travel_agency.css">
  </head>
  <body>
    <main>
      <div id="destCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active" data-bs-interval="3000">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=80" class="d-block w-100" alt="beach">
            <div class="carousel-caption d-none d-md-block">
              <h5>Sunny Beaches</h5>
              <p>Relax by the sea.</p>
            </div>
          </div>
          <div class="carousel-item" data-bs-interval="4000">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1600&q=80" class="d-block w-100" alt="mountains">
            <div class="carousel-caption d-none d-md-block">
              <h5>Mountain Retreats</h5>
              <p>Hike scenic trails.</p>
            </div>
          </div>
          <div class="carousel-item" data-bs-interval="3500">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600&q=80" class="d-block w-100" alt="city">
            <div class="carousel-caption d-none d-md-block">
              <h5>City Escapes</h5>
              <p>Discover urban wonders.</p>
            </div>
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#destCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#destCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <section class="container py-4">
        <h4>Booking Progress</h4>
        <div class="progress" style="height: 1.5rem;">
          <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 70%;" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">70%</div>
        </div>
      </section>

      <footer class="bg-light text-center py-3">
        <div class="container">
          <div>Contact: contact@keshav-travelagency.example</div>
          <div>Phone: +91 9xxxxxxxxx</div>
        </div>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task_tracker.css">
  </head>
  <body>
    <main class="container py-5">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="mb-0">Tasks <span class="badge bg-secondary">4</span></h2>
        <button class="btn btn-outline-success">Completed <span class="badge bg-light text-dark ms-2">2</span></button>
      </div>

      <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Fix header layout
          <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Write blog post
          <span class="badge bg-warning text-dark">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Update tests
          <span class="badge bg-success">Low</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Deploy to staging
          <span class="badge bg-danger">High</span>
        </li>
      </ul>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

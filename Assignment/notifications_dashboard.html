<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="notifications_dashboard.css">
  </head>
  <body>
    <main class="container py-5">
      <h2>Notifications</h2>
      <div class="card p-3">
        <div class="alert alert-success" role="alert">New message arrived.</div>
        <div class="alert alert-info" role="alert">Tip: Use keyboard shortcuts.</div>
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          Warning: Action required!
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="mt-3 p-3 bg-light border rounded">
          <strong>Summary:</strong> 3 notifications, 1 urgent
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

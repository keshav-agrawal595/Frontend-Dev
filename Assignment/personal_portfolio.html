<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="personal_portfolio.css">
  </head>
  <body class="bg-light text-dark">
    <header class="py-4">
      <div class="container text-center">
        <h1 class="fw-bold">Keshav Agrawal</h1>
        <p class="lead">Frontend Developer & Designer</p>
      </div>
    </header>

    <main class="container text-center">
      <img src="https://images.unsplash.com/photo-1531123414780-f0b4321b4f6a?w=600&q=80" alt="profile" class="img-fluid rounded-circle" style="width:180px;">

      <div class="mt-4 p-4 bg-white rounded shadow-sm">
        <p class="mb-3">I build responsive web apps using Bootstrap and modern CSS.</p>
        <div class="d-flex justify-content-center gap-2">
          <a class="btn btn-primary" href="#">Hire Me</a>
          <a class="btn btn-outline-secondary" href="#">Download CV</a>
        </div>

        <form class="mt-4">
          <!-- .form-control provides basic styled inputs -->
          <input class="form-control mb-2" type="email" placeholder="Your email">
          <button class="btn btn-success" type="submit">Contact</button>
        </form>
      </div>
    </main>

    <footer class="text-center py-3">
      <div class="container">&copy; 2025</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

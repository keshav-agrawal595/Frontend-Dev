<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant — Today's Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="restaurant_menu.css">
  </head>
  <body>
    <main class="container py-5">
      <h2 class="text-center mb-4">Today's Menu</h2>

      <div class="row">
        <div class="col-md-8">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Dish</th>
                <th>Category</th>
                <th class="text-end">Price</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Grilled Salmon</td>
                <td>Main</td>
                <td class="text-end">$18.00</td>
              </tr>
              <tr>
                <td>Caesar Salad</td>
                <td>Starter</td>
                <td class="text-end">$8.50</td>
              </tr>
              <tr>
                <td>Chocolate Lava Cake</td>
                <td>Dessert</td>
                <td class="text-end">$6.00</td>
              </tr>
            </tbody>
          </table>
        </div>

        <aside class="col-md-4">
          <h5>Chef's Specials</h5>
          <ul class="list-group mb-3">
            <li class="list-group-item">Truffle Pasta — Limited</li>
            <li class="list-group-item">Lobster Bisque</li>
            <li class="list-group-item">Berry Tart</li>
          </ul>

          <figure>
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&q=80" class="img-fluid" alt="food">
            <figcaption class="text-muted small">Signature dish — served daily</figcaption>
          </figure>
        </aside>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

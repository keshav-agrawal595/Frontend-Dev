<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            width: 90%;
            max-width: 800px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
            filter: brightness(0.7);
        }

        .gallery-item figcaption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            padding: 0.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/200" alt="Image 1">
            <figcaption>Image 1</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/200" alt="Image 2">
            <figcaption>Image 2</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/200" alt="Image 3">
            <figcaption>Image 3</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/200" alt="Image 4">
            <figcaption>Image 4</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/200" alt="Image 5">
            <figcaption>Image 5</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/200" alt="Image 6">
            <figcaption>Image 6</figcaption>
        </figure>
    </div>
</body>
</html>

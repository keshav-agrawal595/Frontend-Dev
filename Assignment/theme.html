<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>theme</title>
		<style>
			body.light { background: #fff; color: #000 }
			body.dark { background: #222; color: #fff }
			body.blue { background: #e0f0ff; color: #003 }
		</style>
	</head>
	<body>
		<button class="themeBtn" data-theme="light">Light</button>
		<button class="themeBtn" data-theme="dark">Dark</button>
		<button class="themeBtn" data-theme="blue">Blue</button>
		<script src="theme.js"></script>
	</body>
</html>

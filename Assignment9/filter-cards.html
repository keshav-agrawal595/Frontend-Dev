<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .card-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .card {
            flex: 1 1 calc(33.33% - 1rem);
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease;
            animation: fadeIn 1s ease;
        }

        .card img {
            width: 100%;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card:hover img {
            filter: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 800px) {
            .card {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <img src="1.jpeg" alt="Profile 1">
            <p>Profile 1</p>
        </div>
        <div class="card">
            <img src="2.jpeg" alt="Profile 2">
            <p>Profile 2</p>
        </div>
        <div class="card">
            <img src="3.jpeg" alt="Profile 3">
            <p>Profile 3</p>
        </div>
    </div>
</body>
</html>

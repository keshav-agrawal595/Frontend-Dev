<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>gallery</title>
		<style>
			.thumb { width: 100px; height: 70px; object-fit: cover; margin: 4px }
			#modal {
				display: none;
				position: fixed;
				left: 0;
				top: 0;
				right: 0;
				bottom: 0;
				background: rgba(0, 0, 0, 0.6);
				align-items: center;
				justify-content: center;
			}
			#modalImg { max-width: 80%; max-height: 80% }
		</style>
	</head>
	<body>
		<img class="thumb" src="https://via.placeholder.com/300x200?text=1">
		<img class="thumb" src="https://via.placeholder.com/300x200?text=2">
		<img class="thumb" src="https://via.placeholder.com/300x200?text=3">
		<img class="thumb" src="https://via.placeholder.com/300x200?text=4">
		<img class="thumb" src="https://via.placeholder.com/300x200?text=5">
		<img class="thumb" src="https://via.placeholder.com/300x200?text=6">
		<div id="modal"><img id="modalImg"></div>
		<script src="gallery.js"></script>
	</body>
</html>

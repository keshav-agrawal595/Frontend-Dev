<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Principles</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 2rem;
        }

        .principles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .principle {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            padding: 1rem;
            text-align: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .principle:hover {
            background: linear-gradient(135deg, #007bff, #6c757d);
            color: white;
        }

        @media (max-width: 600px) {
            .principles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="principles">
        <div class="principle">
            <h3>Fluid Layouts</h3>
            <p>Use percentages for widths.</p>
        </div>
        <div class="principle">
            <h3>Flexible Media</h3>
            <p>Images scale with max-width: 100%.</p>
        </div>
        <div class="principle">
            <h3>Breakpoints</h3>
            <p>Use media queries for responsiveness.</p>
        </div>
    </div>
</body>
</html>

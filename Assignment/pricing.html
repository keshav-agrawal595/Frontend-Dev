<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="pricing.css" />
</head>
<body>
  <header>
    <h1>Pricing</h1>
  </header>

  <main>
    <section class="plans">
      <article class="plan">
        <h2>Basic</h2>
        <p class="price">₹499</p>
        <ul>
          <li>Feature A</li>
          <li>Feature B</li>
          <li>Basic support</li>
        </ul>
        <a href="#" class="btn">Choose Basic</a>
      </article>

      <article class="plan popular">
        <h2>Standard</h2>
        <p class="price">₹999</p>
        <ul>
          <li>Everything in Basic</li>
          <li>Feature C</li>
          <li>Priority support</li>
        </ul>
        <a href="#" class="btn">Choose Standard</a>
      </article>

      <article class="plan">
        <h2>Premium</h2>
        <p class="price">₹1999</p>
        <ul>
          <li>All Standard features</li>
          <li>Feature D</li>
          <li>Dedicated support</li>
        </ul>
        <a href="#" class="btn">Choose Premium</a>
      </article>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Frameset Layout</title>
</head>
<frameset rows="20%,80%">
    <frame srcdoc="<h3>Home | About | Contact</h3>" title="Navigation">
    <frame srcdoc="<p>Welcome to My Website</p>" title="Main Content">
</frameset>
</html>
<!-- Note: The <frameset> and <frame> tags are deprecated in HTML5.
     They may not display in modern browsers. -->

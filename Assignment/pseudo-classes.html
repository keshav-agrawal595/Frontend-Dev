<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0056b3;
        }

        a:focus {
            outline: 2px solid #ffcc00;
        }

        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            background-color: #003f7f;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li:nth-child(odd) {
            background-color: #e9ecef;
        }

        li:nth-child(even) {
            background-color: #dee2e6;
        }

        .example {
            text-align: center;
        }

        .example p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="example">
            <p><strong>Hover and Focus on Link:</strong></p>
            <a href="#">Hover or Focus Me</a>
        </div>
        <div class="example">
            <p><strong>Hover and Active on Button:</strong></p>
            <button>Click Me</button>
        </div>
        <div class="example">
            <p><strong>:nth-child() on List Items:</strong></p>
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>                                
                <li>Item 3</li>
                <li>Item 4</li>
            </ul>
        </div>
    </div>
</body>
</html>

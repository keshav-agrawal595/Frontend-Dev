<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom Themed Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="blog_theme.css">
  </head>
  <body>
    <header class="py-4 bg-primary text-white">
      <div class="container">
        <h1 class="mb-0">Travelog</h1>
      </div>
    </header>

    <main class="container py-5">
      <div class="row g-4">
        <div class="col-md-6">
          <article class="card">
            <div class="card-body">
              <h3 class="card-title">Exploring the Alps</h3>
              <p class="card-text">A short excerpt from the blog post. Learn how we customized Bootstrap's theme color.</p>
              <a class="btn btn-primary" href="#">Read more</a>
            </div>
          </article>
        </div>

        <div class="col-md-6">
          <article class="card">
            <div class="card-body">
              <h3 class="card-title">Coastal Getaways</h3>
              <p class="card-text">Tips and photos from the coast.</p>
              <a class="btn btn-primary" href="#">Read more</a>
            </div>
          </article>
        </div>
      </div>
    </main>

    <footer class="bg-light py-3">
      <div class="container text-center">&copy; 2025 Travelog</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

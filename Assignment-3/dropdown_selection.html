<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dropdown Selection</title>
</head>
<body>
<h1>Selection Page</h1>


<form>
<label for="country">Country:</label><br>
<select id="country" name="country">
<option selected>India</option>
<option>USA</option>
<option>Japan</option>
</select><br><br>


<label for="state">State:</label><br>
<select id="state" name="state">
<option selected>Maharashtra</option>
<option>Kerala</option>
<option>Karnataka</option>
</select><br><br>


<label for="city">City:</label><br>
<select id="city" name="city">
<option selected>Mumbai</option>
<option>Pune</option>
<option>Goa</option>
</select><br><br>


<label for="place">Favorite Tourist Place:</label><br>
<select id="place" name="place">
<option selected>Gateway of India</option>
<option>Marine Drive</option>
<option>Elephanta Caves</option>
</select>
</form>


<p>Selected: Country — India; State — Maharashtra; City — Mumbai; Favorite Place — Gateway of India</p>
</body>
</html>

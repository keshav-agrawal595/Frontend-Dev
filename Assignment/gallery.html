<!DOCTYPE html>
<html lang="en">

      </figure>
      <figure class="item">
        <img src="img4.jpg" alt="Image 4">
        <figcaption>Caption 4</figcaption>
      </figure>
      <figure class="item">
        <img src="img5.jpg" alt="Image 5">
        <figcaption>Caption 5</figcaption>
      </figure>
      <figure class="item">
        <img src="img6.jpg" alt="Image 6">
        <figcaption>Caption 6</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Complete Layout — Keshav</title>
  <link rel="stylesheet" href="complete-layout.css" />
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="home" class="hero">
    <div class="hero-inner">
      <h1>Welcome to Keshav's Site</h1>
      <p>A place demonstrating layout, box model and positioning.</p>
    </div>
  </section>

  <section id="about" class="about">
    <div class="about-text">
      <h2>About</h2>
      <p>Keshav builds clean interfaces and prototypes with semantic markup.</p>
    </div>
    <div class="about-image">
      <img src="about-img.jpg" alt="About image">
    </div>
  </section>

  <section id="services" class="services">
    <article class="service">Service 1</article>
    <article class="service">Service 2</article>
    <article class="service">Service 3</article>
  </section>

  <section id="contact" class="contact">
    <form>
      <label>Name<input type="text" placeholder="Keshav"></label>
      <label>Email<input type="email" placeholder="you@example.com"></label>
      <label>Message<textarea rows="4"></textarea></label>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer class="site-footer">
    <p>&copy; 2025 Keshav Agrawal</p>
  </footer>
</body>
</html>

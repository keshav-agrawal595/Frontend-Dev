<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
        }

        header, footer {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 1rem;
            padding: 1rem;
        }

        .sidebar {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            padding: 1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .card {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            padding: 1rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .card {
            animation: fadeIn 1s ease;
        }

        @media (max-width: 750px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .sidebar {
                grid-row: 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Dashboard</h1>
    </header>
    <div class="dashboard">
        <div class="sidebar">Sidebar</div>
        <div class="main-content">
            <div class="card">Filters</div>
            <div class="card">Typography</div>
            <div class="card">Media Queries</div>
            <div class="card">Cheat Sheet Links</div>
        </div>
    </div>
    <footer>
        <p>Footer Content</p>
    </footer>
</body>
</html>

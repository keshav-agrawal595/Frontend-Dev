<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product_catalog.css">
  </head>
  <body>
    <main class="container py-5">
      <h2 class="mb-4">Products</h2>
      <div class="row g-4">
        <!-- Use col-md-3 for 4 columns on md+, 2 on sm, 1 on xs -->
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 shadow-sm product-card">
            <img src="https://images.unsplash.com/photo-1513708928671-6b1a82a2f1f3?w=800&q=80" class="card-img-top img-fluid" alt="product">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Product A</h5>
              <p class="mb-2">$29.99</p>
              <a href="#" class="btn btn-primary mt-auto">Add to Cart</a>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 shadow-sm product-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800&q=80" class="card-img-top img-fluid" alt="product">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Product B</h5>
              <p class="mb-2">$49.99</p>
              <a href="#" class="btn btn-primary mt-auto">Add to Cart</a>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 shadow-sm product-card">
            <img src="https://images.unsplash.com/photo-1536305030010-1a6b0d4f3b8d?w=800&q=80" class="card-img-top img-fluid" alt="product">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Product C</h5>
              <p class="mb-2">$19.99</p>
              <a href="#" class="btn btn-primary mt-auto">Add to Cart</a>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 shadow-sm product-card">
            <img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=800&q=80" class="card-img-top img-fluid" alt="product">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Product D</h5>
              <p class="mb-2">$59.99</p>
              <a href="#" class="btn btn-primary mt-auto">Add to Cart</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q1 - Borders & Padding</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header>
    <h1>Borders & Padding Demo</h1>
  </header>
  <main>
    <section class="container">
      <div class="box solid">Solid<br>padding:16px</div>
      <div class="box dashed">Dashed<br>border-radius:12px</div>
      <div class="box double">Double<br>padding:24px</div>
      <div class="box groove">Groove<br>border-radius:50%</div>
    </section>
  </main>
</body>
</html>

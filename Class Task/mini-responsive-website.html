<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Responsive Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        header, footer {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            background-color: #0056b3;
            padding: 0.5rem;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 2rem;
            background-color: #e9ecef;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 4rem);
        }

        .hero p {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
        }

        .blog {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        .blog-card {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            padding: 1rem;
            text-align: center;
        }

        .contact {
            padding: 2rem;
            background-color: #e9ecef;
        }

        .contact form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .contact input, .contact textarea, .contact button {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Mini Responsive Website</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
    </nav>
    <section class="hero">
        <h1>Welcome to Our Website</h1>
        <p>Explore our content and get in touch with us.</p>
    </section>
    <section class="blog">
        <div class="blog-card">
            <h3>Blog Post 1</h3>
            <p>Summary of blog post 1.</p>
        </div>
        <div class="blog-card">
            <h3>Blog Post 2</h3>
            <p>Summary of blog post 2.</p>
        </div>
        <div class="blog-card">
            <h3>Blog Post 3</h3>
            <p>Summary of blog post 3.</p>
        </div>
    </section>
    <section class="contact">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" rows="4" required></textarea>
            <button type="submit">Send</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2025 Mini Responsive Website</p>
    </footer>
</body>
</html>

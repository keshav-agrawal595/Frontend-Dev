<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 1rem;
        }

        .comparison {
            display: flex;
            gap: 1rem;
        }

        .comparison img {
            width: 300px;
            height: auto;
            transition: filter 0.3s ease;
        }

        .filtered img {
            filter: brightness(0.5);
        }

        .filtered:hover img {
            filter: none;
        }

        @media (max-width: 700px) {
            .comparison {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="comparison">
        <div>
            <img src="org.jpeg" alt="Original">
            <p>Original</p>
        </div>
        <div class="filtered">
            <img src="fil.jpeg" alt="Filtered">
            <p>Filtered</p>
        </div>
    </div>
</body>
</html>
